name: Antigravity Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace-validation:
    name: 1. Workspace & Architecture Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CI & Workspace Health Check
        run: node .agents/scripts/ci-health.js

      - name: Run Automated Agent Rules & Skills Suite
        run: node .agents/scripts/test-all.js

      - name: Execute Evidence Audit & Red Team Suite
        run: node .agents/scripts/reproduce-validation.js

      - name: Upload Evidence Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-audit-report-${{ github.sha }}
          path: docs/REPRODUCIBLE_AUDIT_REPORT.json
          retention-days: 14

  security-scan:
    name: 2. Security & Secret Defense Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Secret Scrubber & Credential Scanner
        run: node .agents/scripts/security-check.js

      - name: Run Workspace Escape Red Team Suite
        run: node tests/security/workspace_escape/run-test.js

      - name: Run Secret Boundary Isolation Suite
        run: node tests/security/secret_boundary/run-test.js

      - name: Run MCP Trust Boundary Suite
        run: node tests/security/mcp_trust_boundary/run-test.js

  android-build-and-test:
    name: 3. Android Gradle Build & Tests
    needs: [workspace-validation, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Run Android Lint Check
        run: ./gradlew lintDebug --continue

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK Integrity & Compute SHA-256
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            APK_SIZE=$(stat -c%s "$APK_FILE")
            APK_SHA=$(sha256sum "$APK_FILE" | awk '{print $1}')
            BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
            echo "APK_SHA=$APK_SHA" >> $GITHUB_ENV
            echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
            echo "## Debug APK Verification" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Variant** | \`debug\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Path** | \`$APK_FILE\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Size** | \`$APK_SIZE bytes\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **SHA-256** | \`$APK_SHA\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Built At** | \`$BUILD_TIME\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Status** | \`BUILD SUCCESS\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "ERROR: APK file not found at $APK_FILE" >&2
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload Lint Analysis Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  ci-summary:
    name: 4. CI Execution Summary
    needs: [workspace-validation, security-scan, android-build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Job Summary Report
        run: |
          echo "## Antigravity Mobile CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Notes |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 1. Workspace Integrity | ${{ needs.workspace-validation.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Agent Rules, Skills, Vertical Slice & Reproduction |" >> $GITHUB_STEP_SUMMARY
          echo "| 2. Security Defense Gate | ${{ needs.security-scan.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Secret Scrubber, Workspace Escape (18/18), MCP & Injection Defense |" >> $GITHUB_STEP_SUMMARY
          echo "| 3. Android Build & Tests | ${{ needs.android-build-and-test.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Unit Tests, Lint Analysis & Debug APK Packaging |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CI Failure Classification Taxonomy" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Condition | Impact |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **SOURCE / TEST FAILURE** | Unit test assertion fails | Blocks CI on code regression |" >> $GITHUB_STEP_SUMMARY
          echo "| **BUILD FAILURE** | Gradle compile or assembly fails | Blocks CI on syntax/packaging error |" >> $GITHUB_STEP_SUMMARY
          echo "| **SECURITY FAILURE** | Path escape, secret leak, or injection | Blocks CI unconditionally |" >> $GITHUB_STEP_SUMMARY
          echo "| **RUNNER / ENVIRONMENT FAILURE** | Wrapper permission denied, missing JDK | Blocks CI on infrastructure fault |" >> $GITHUB_STEP_SUMMARY
          echo "| **ARTIFACT FAILURE** | APK missing or digest mismatch | Blocks release artifact packaging |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Debug APK is available in the **Artifacts** section above for physical device testing." >> $GITHUB_STEP_SUMMARY
