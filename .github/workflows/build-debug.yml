name: Build Debug APK (On-Demand)

on:
  workflow_dispatch:
    inputs:
      buildComment:
        description: 'Optional build note or reference'
        required: false
        default: 'Manual device testing build'

jobs:
  build-apk:
    name: Package Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Validate Gradle Environment Diagnostics
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "=== Gradle Wrapper Permissions ==="
          ls -la gradlew
          head -n 1 gradlew
          echo "=== Gradle Wrapper Execution ==="
          ./gradlew --version

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK & Generate SHA-256 Digest
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            APK_SIZE=$(stat -c%s "$APK_FILE")
            APK_SHA=$(sha256sum "$APK_FILE" | awk '{print $1}')
            BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "## Debug APK Ready for Device Installation" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Variant** | \`debug\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Path** | \`$APK_FILE\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Size** | \`$APK_SIZE bytes\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **SHA-256** | \`$APK_SHA\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Built At** | \`$BUILD_TIME\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Status** | \`BUILD SUCCESS\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Device Installation Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Download the \`antigravity-debug-device-apk-${{ github.sha }}\` artifact from this run." >> $GITHUB_STEP_SUMMARY
            echo "2. Unzip and install via ADB: \`adb install -r app-debug.apk\` or copy to phone." >> $GITHUB_STEP_SUMMARY
          else
            echo "ERROR: APK file not found at $APK_FILE" >&2
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-debug-device-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
