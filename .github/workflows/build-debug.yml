name: Build Debug APK (On-Demand)

on:
  workflow_dispatch:
    inputs:
      buildComment:
        description: 'Optional build note or reference'
        required: false
        default: 'Manual device testing build'

jobs:
  build-apk:
    name: Package Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-debug-device-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Emit Download Instructions
        run: |
          echo "## Debug APK Ready for Device Installation" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "2. Download \`antigravity-debug-device-apk-${{ github.sha }}\`." >> $GITHUB_STEP_SUMMARY
          echo "3. Extract the ZIP to obtain \`app-debug.apk\`." >> $GITHUB_STEP_SUMMARY
          echo "4. Install via ADB: \`adb install -r app-debug.apk\` or transfer to phone." >> $GITHUB_STEP_SUMMARY
